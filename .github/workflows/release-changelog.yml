name: Publish Release Changelog

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Changelogs
        run: npm run validate

      - name: Build Manifest Index (index.json)
        run: npm run build:manifest

      - name: Commit updated index.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add changelogs/index.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(changelog): update index.json for release [skip ci]"
            git push origin HEAD:main
          fi

      - name: Create GitHub Release (REST API Accessible, No Binaries)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
          fi

          ZH_CHANGELOG="changelogs/${TAG}/zh-CN.md"
          EN_CHANGELOG="changelogs/${TAG}/en-US.md"
          
          NOTES=""
          if [ -f "$ZH_CHANGELOG" ]; then
            NOTES=$(cat "$ZH_CHANGELOG")
          elif [ -f "$EN_CHANGELOG" ]; then
            NOTES=$(cat "$EN_CHANGELOG")
          else
            NOTES="Release $TAG changelog updated."
          fi

          echo "$NOTES" > release_notes.tmp

          # Create release or edit existing release without attaching build binaries
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release_notes.tmp
          else
            gh release create "$TAG" --title "SF6S Release $TAG" --notes-file release_notes.tmp
          fi
          
          rm release_notes.tmp
